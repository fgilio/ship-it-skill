# Local git hooks via lefthook. Mirrors the CI format and lint gates so a commit
# fixes formatting and lint findings before it can fail CI. Install once per
# clone with `lefthook install`.
#
# No package.json in this repo, so Prettier and Oxlint are fetched on demand
# with npx, the same way the CI jobs run them.

pre-commit:
  commands:
    format:
      glob: "*.{md,mdx,json,yml,yaml,mjs,js}"
      run: npx --yes prettier@3 --write {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{mjs,js}"
      # .oxlintrc.json ignores the fixtures, and Oxlint exits 1 when every file
      # it was given is ignored, so the hook never hands them over.
      exclude:
        - "test/fixtures/**"
      run: npx --yes oxlint@1.90.0 --deny-warnings {staged_files}
